<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="index.css">
  
  <title>Frontend Mentor | Results summary component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <div id="container">
    <div id="left_div">
      <div id="ld_content">
      <p>Your Result</p>
      <div id="circle"><h1 style="margin-top: 30px;">76</h1><h5 style="margin-top: -20px;">of 100</h5></div>
      <h2 style="margin-top: -35px;">Great</h2>
      <div style="margin-left: 25px; margin-right: 25px; margin-top: -15px;">You scored higher than 65% of the people who have taken these tests.<br></div>
      </div>
    </div>


    <div id="right_div">
      <div id="rd_content">
        <h3 class="summary">Summary</h3>
        <div id="reaction"><img src="./assets/images/icon-reaction.svg" alt="">Reaction        <b>80 </b>/ 100</div><br>
        <div id="memory"><img src="./assets/images/icon-memory.svg" alt="">Memory <b>92 </b>/ 100</div><br>
        <div id="verbal"><img src="./assets/images/icon-verbal.svg" alt="">Verbal <b>61 </b>/ 100</div><br>
        <div id="visual"><img src="./assets/images/icon-visual.svg" alt="">Visual <b>72 </b>/ 100</div><br><br>
        <div id="Continue">Continue</div>
      </div>
    </div>
  </div>

  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">Sanni Abdulmujeeb</a>.
  </div>
</body>
</html>
